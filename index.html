<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contagem Certa</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; min-height: 100vh; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .badge-rede { padding: 8px 14px; border-radius: 6px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .online { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid var(--green); }
    .offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid var(--red); }

    .config-inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .config-inline input, .config-inline select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; }

    .scanner-box { background: var(--card); border: 2px solid var(--blue); border-radius: 12px; padding: 20px; margin-bottom: 16px; text-align: center; }
    .scanner-box.erro { border-color: var(--red); background: rgba(239, 68, 68, 0.12); }
    .scanner-box.sucesso { border-color: var(--green); background: rgba(16, 185, 129, 0.12); }
    
    #campoQR { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 24px; padding: 14px; border-radius: 8px; text-align: center; outline: none; margin-top: 8px; }
    #feedbackMsg { margin-top: 10px; font-size: 16px; font-weight: 600; min-height: 24px; color: var(--muted); }

    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
    .card-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .card-val { font-size: 42px; font-weight: 800; margin-top: 6px; }
    .val-pendente { color: var(--amber); }
    .val-sync { color: var(--green); }

    .acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    button { background: var(--blue); color: white; border: none; padding: 12px 18px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.sec { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    button.test { background: #6366f1; }

    .historico { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; flex: 1; overflow-y: auto; max-height: 240px; }
    .historico h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
    .tag-pend { color: var(--amber); font-weight: 600; }
    .tag-ok { color: var(--green); font-weight: 600; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div id="statusRede" class="badge-rede online">● ONLINE</div>
    <div class="config-inline">
      <input type="text" id="cfgPosto" placeholder="Posto / Máquina (ex: INJ-03)" onchange="salvarConfig()">
      <input type="text" id="cfgOperador" placeholder="Matrícula / Operador" onchange="salvarConfig()">
      <select id="cfgModo" onchange="salvarConfig()">
        <option value="unico">Etiqueta Única (Bloqueia Repetida)</option>
        <option value="lote">Etiqueta de Lote (Debounce 1.5s)</option>
      </select>
    </div>
  </div>

  <div id="scannerContainer" class="scanner-box">
    <div style="font-size: 14px; color: var(--muted);">PRONTO PARA LEITURA DO QR CODE</div>
    <!-- inputmode="none" impede o teclado virtual do Android de cobrir a tela -->
    <input type="text" id="campoQR" inputmode="none" autocomplete="off" autofocus placeholder="Aguardando bip...">
    <div id="feedbackMsg">Aponte o leitor para a etiqueta</div>
  </div>

  <div class="grid-cards">
    <div class="card">
      <div class="card-label">Total Lido no Turno</div>
      <div id="cntTotal" class="card-val">0</div>
    </div>
    <div class="card">
      <div class="card-label">Fila Local (Pendentes)</div>
      <div id="cntPendentes" class="card-val val-pendente">0</div>
    </div>
    <div class="card">
      <div class="card-label">Enviados à Planilha</div>
      <div id="cntSincronizados" class="card-val val-sync">0</div>
    </div>
  </div>

  <div class="acoes">
    <button id="btnSync" onclick="sincronizarLote()">Sincronizar Agora</button>
    <button class="test" onclick="simularLeituraTeste()">Simular Bip (Teste Celular)</button>
    <button class="sec" onclick="exportarCSV()">Baixar Backup CSV</button>
    <button class="sec" onclick="limparTurno()">Zerar Turno</button>
  </div>

  <div class="historico">
    <h3>ÚLTIMAS 10 LEITURAS</h3>
    <table>
      <thead>
        <tr>
          <th>Hora</th>
          <th>Código QR</th>
          <th>Posto</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tabelaRecentes"></tbody>
    </table>
  </div>

  <script>
    // ==========================================
    // CONFIGURAÇÃO PRINCIPAL
    // ==========================================
    const URL_APPS_SCRIPT = "COLE_AQUI_SUA_URL_DO_APPS_SCRIPT";
    const INTERVALO_SYNC_MS = 60000; // Sincroniza a cada 60 segundos
    const TAMANHO_LOTE = 100;        // Envia até 100 registros por pacote

    let db;
    let sincronizando = false;
    let ultimoCodigo = "";
    let ultimoTimestamp = 0;

    // ==========================================
    // 1. SINTETIZADOR DE ÁUDIO (WEB AUDIO API)
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function tocarSom(tipo) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (tipo === "ok") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } else {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      }
    }

    // ==========================================
    // 2. BANCO DE DADOS LOCAL (INDEXEDDB)
    // ==========================================
    function iniciarDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("ContagemCertaDB", 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          const store = database.createObjectStore("leituras", { keyPath: "id" });
          store.createIndex("status", "status", { unique: false });
          store.createIndex("codigoQR", "codigoQR", { unique: false });
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    function adicionarLeituraDB(registro) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["leituras"], "readwrite");
        const store = tx.objectStore("leituras");
        const req = store.add(registro);
        req.onsuccess = () => resolve(true);
        req.onerror = (e) => reject(e);
      });
    }

    function obterTodasLeituras() {
      return new Promise((resolve) => {
        const tx = db.transaction(["leituras"], "readonly");
        const req = tx.objectStore("leituras").getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    function marcarComoSincronizados(ids) {
      return new Promise((resolve) => {
        const tx = db.transaction(["leituras"], "readwrite");
        const store = tx.objectStore("leituras");
        ids.forEach(id => {
          const getReq = store.get(id);
          getReq.onsuccess = () => {
            const item = getReq.result;
            if (item) {
              item.status = "sincronizado";
              store.put(item);
            }
          };
        });
        tx.oncomplete = () => resolve();
      });
    }

    // ==========================================
    // 3. CAPTURA E VALIDAÇÃO DE LEITURA
    // ==========================================
    const campoQR = document.getElementById("campoQR");

    // Mantém o foco no campo do leitor sem roubar cliques dos inputs de configuração
    document.addEventListener("click", (e) => {
      if (!["INPUT", "SELECT", "BUTTON"].includes(e.target.tagName)) {
        campoQR.focus();
      }
    });

    campoQR.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const codigo = campoQR.value.trim();
        campoQR.value = "";
        if (codigo) await processarCodigo(codigo);
      }
    });

    async function processarCodigo(codigo) {
      const modo = document.getElementById("cfgModo").value;
      const posto = document.getElementById("cfgPosto").value.trim() || "POSTO-PADRAO";
      const operador = document.getElementById("cfgOperador").value.trim() || "NAO-INFORMADO";
      const agora = Date.now();

      // Debounce de 1.5s para evitar leitura tremida
      if (codigo === ultimoCodigo && (agora - ultimoTimestamp) < 1500) {
        mostrarFeedback(`Bloqueado (leitura dupla rápida): ${codigo}`, "erro");
        tocarSom("erro");
        return;
      }

      const todas = await obterTodasLeituras();

      // Se modo "Etiqueta Única", impede bipar o mesmo QR Code duas vezes no turno
      if (modo === "unico" && todas.some(item => item.codigoQR === codigo)) {
        mostrarFeedback(`DUPLICADO! Peça já bipada neste turno: ${codigo}`, "erro");
        tocarSom("erro");
        return;
      }

      ultimoCodigo = codigo;
      ultimoTimestamp = agora;

      const registro = {
        id: `${posto}-${agora}-${Math.random().toString(36).substring(2, 6)}`,
        timestamp: agora,
        dataHora: new Date().toLocaleString("pt-BR"),
        codigoQR: codigo,
        posto: posto,
        operador: operador,
        status: "pendente"
      };

      await adicionarLeituraDB(registro);
      tocarSom("ok");
      mostrarFeedback(`Registrado: ${codigo}`, "sucesso");
      atualizarInterface();
    }

    function mostrarFeedback(texto, tipo) {
      const box = document.getElementById("scannerContainer");
      const msg = document.getElementById("feedbackMsg");
      msg.textContent = texto;
      box.className = `scanner-box ${tipo}`;
      setTimeout(() => { box.className = "scanner-box"; }, 900);
    }

    // ==========================================
    // 4. MOTOR DE SINCRONIZAÇÃO EM LOTES
    // ==========================================
    async function sincronizarLote() {
      if (sincronizando || !navigator.onLine || URL_APPS_SCRIPT.includes("COLE_AQUI")) return;

      const todas = await obterTodasLeituras();
      const pendentes = todas.filter(item => item.status === "pendente").slice(0, TAMANHO_LOTE);
      if (pendentes.length === 0) return;

      sincronizando = true;
      const btn = document.getElementById("btnSync");
      btn.disabled = true;
      btn.textContent = "Sincronizando...";

      try {
        const resp = await fetch(URL_APPS_SCRIPT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ leituras: pendentes })
        });
        const dados = await resp.json();

        if (dados.status === "ok") {
          await marcarComoSincronizados(pendentes.map(p => p.id));
          await atualizarInterface();
        }
      } catch (err) {
        console.warn("Sem resposta do servidor, mantendo na fila offline:", err);
      } finally {
        sincronizando = false;
        btn.disabled = false;
        btn.textContent = "Sincronizar Agora";
      }
    }

    // ==========================================
    // 5. INTERFACE, CONFIGURAÇÕES E UTILITÁRIOS
    // ==========================================
    async function atualizarInterface() {
      const todas = await obterTodasLeituras();
      todas.sort((a, b) => b.timestamp - a.timestamp);

      const pendentes = todas.filter(i => i.status === "pendente").length;
      const sincronizados = todas.length - pendentes;

      document.getElementById("cntTotal").textContent = todas.length;
      document.getElementById("cntPendentes").textContent = pendentes;
      document.getElementById("cntSincronizados").textContent = sincronizados;

      const tbody = document.getElementById("tabelaRecentes");
      tbody.innerHTML = todas.slice(0, 10).map(item => `
        <tr>
          <td>${item.dataHora.split(" ")[1] || item.dataHora}</td>
          <td><strong>${item.codigoQR}</strong></td>
          <td>${item.posto}</td>
          <td class="${item.status === 'pendente' ? 'tag-pend' : 'tag-ok'}">
            ${item.status === 'pendente' ? 'Na Fila Local' : 'Sincronizado'}
          </td>
        </tr>
      `).join("");
    }

    function atualizarStatusRede() {
      const el = document.getElementById("statusRede");
      if (navigator.onLine) {
        el.textContent = "● ONLINE — Sincronização ativa";
        el.className = "badge-rede online";
        sincronizarLote();
      } else {
        el.textContent = "● OFFLINE — Operando em memória local";
        el.className = "badge-rede offline";
      }
    }

    function salvarConfig() {
      localStorage.setItem("cc_posto", document.getElementById("cfgPosto").value);
      localStorage.setItem("cc_operador", document.getElementById("cfgOperador").value);
      localStorage.setItem("cc_modo", document.getElementById("cfgModo").value);
    }

    function carregarConfig() {
      document.getElementById("cfgPosto").value = localStorage.getItem("cc_posto") || "INJ-01";
      document.getElementById("cfgOperador").value = localStorage.getItem("cc_operador") || "";
      document.getElementById("cfgModo").value = localStorage.getItem("cc_modo") || "unico";
    }

    function simularLeituraTeste() {
      const codigoFake = "PEC-" + Math.floor(100000 + Math.random() * 900000);
      processarCodigo(codigoFake);
    }

    async function exportarCSV() {
      const todas = await obterTodasLeituras();
      if (todas.length === 0) return alert("Nenhum registro local para exportar.");
      const linhas = ["ID;Data_Hora;Codigo_QR;Posto;Operador;Status"];
      todas.forEach(r => linhas.push(`${r.id};${r.dataHora};${r.codigoQR};${r.posto};${r.operador};${r.status}`));
      const blob = new Blob([linhas.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `backup_contagem_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    async function limparTurno() {
      const todas = await obterTodasLeituras();
      const pendentes = todas.filter(i => i.status === "pendente").length;
      if (pendentes > 0 && !confirm(`Existem ${pendentes} leituras NÃO sincronizadas. Deseja apagar mesmo assim?`)) return;
      if (!confirm("Zerar o contador local para iniciar novo turno?")) return;

      const tx = db.transaction(["leituras"], "readwrite");
      tx.objectStore("leituras").clear();
      tx.oncomplete = () => atualizarInterface();
    }

    // Inicialização
    window.addEventListener("online", atualizarStatusRede);
    window.addEventListener("offline", atualizarStatusRede);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(err => console.warn("SW erro:", err));
    }

    (async () => {
      carregarConfig();
      await iniciarDB();
      atualizarStatusRede();
      await atualizarInterface();
      setInterval(sincronizarLote, INTERVALO_SYNC_MS);
    })();
  </script>
</body>
</html>
